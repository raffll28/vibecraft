<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="3D status monitor for your Claude Code sessions" />
    <meta name="theme-color" content="#0f172a" />
    <title>Vibecraft</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
  </head>
  <body>
    <div id="app">
      <!-- 3D Scene -->
      <div id="scene-panel">
        <div id="canvas-container"></div>

        <!-- Scene HUD -->
        <div id="scene-hud">
          <div class="scene-badge unified-hud">
            <div id="status-dot"></div>
            <span id="status-text"></span>
            <button id="power-button" title="Turn off the vibecraft server" aria-label="Turn off the vibecraft server">⏻</button>
          </div>
        </div>

        <!-- Keybind Helper (bottom-left) -->
        <div id="keybind-helper">
          <div class="keybind-list">
            <span class="keybind"><kbd>1-9</kbd> sessions · <kbd>`</kbd><kbd>0</kbd> all · <kbd>F</kbd> follow · <kbd>P</kbd> panels</span>
          </div>
        </div>

      </div>

    </div>

    <!-- Not Connected Overlay -->
    <div id="not-connected-overlay">
      <div class="not-connected-content">
        <h2 id="not-connected-title">Vibecraft!</h2>
        <p class="not-connected-description">
          A 3D monitor for the Claude Code sessions running in your terminals.
        </p>
        <div class="not-connected-setup">
          <p class="not-connected-setup-label">The vibecraft server isn't running. Open the Vibecraft launcher, or run:</p>
          <div class="not-connected-code">./vibecraft.sh</div>
        </div>
        <div class="not-connected-actions">
          <button class="not-connected-btn not-connected-btn-retry" id="retry-connection">↻ Reconnect</button>
          <button class="not-connected-btn not-connected-btn-explore" id="explore-offline">👀 Explore</button>
        </div>
      </div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
